version: '3.8'

services:
  srj-guardian-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srj_guardian_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY}
      - PRIMARY_ADMIN_PHONE=${PRIMARY_ADMIN_PHONE}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - srj_guardian_data:/app/.data

volumes:
  srj_guardian_data:
    driver: local
